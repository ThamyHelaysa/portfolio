[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

# Licensed webfonts from Netlify Blobs (production only), see plugins/fetch-fonts
[[plugins]]
  package = "./plugins/fetch-fonts"

# The Lighthouse Plugin
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    output_path = "reports/lighthouse.html"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "https://t-helaysa.com"